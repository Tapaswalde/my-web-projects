<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="index.css" rel="stylesheet">
    <title>Word Scramble</title>
</head>
<body>
    <div class="container">
        <div class="gameBox">
            <h1>Word Scramble</h1>
            <p id="word"></p>
            <p>Time left:<span id="time">60</span>s</p>
            <input id="userInput" type="text">
            <div class="buttons">
            <button class="btn1 btn" id="refresh">Refresh</button>
            <button class="btn2 btn" id="check">Check</button>
            </div>
            <p class="result" id="result"></p>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
